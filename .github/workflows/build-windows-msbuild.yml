name: Windows x64 MSBuild - MuFlex V23

on:
  push:
    branches:
      - fix/muflex-v14-stage0-capture-msbuild
      - feat/muflex-v18-bounded-runtime-probe
      - feat/muflex-v19-runtime-image-writes
      - feat/muflex-v20-hotspot-page-trace
      - feat/muflex-v21-external-memory-probe
      - feat/muflex-v22-runtime-coverage-windows
      - feat/muflex-v23-runtime-flow-edges
  pull_request:

jobs:
  windows-msbuild:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake 4 for project generation
        run: python -m pip install "cmake>=4,<5"

      - name: Generate Visual Studio solution
        shell: pwsh
        run: |
          $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          $cmakeExe = Join-Path $cmakeBin "cmake.exe"
          & $cmakeExe --version
          & $cmakeExe -S . -B build -G "Visual Studio 18 2026" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake generation failed" }

      - name: Compile Release x64 with MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          $sln = Get-ChildItem ".\build" -File | Where-Object { $_.Extension -in ".sln",".slnx" } | Select-Object -First 1
          if (-not $sln) { throw "Visual Studio solution not generated" }
          & $msbuild $sln.FullName /t:Build /m:4 /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }

      - name: Smoke test CLI (no protected PE executed)
        shell: pwsh
        run: |
          $exe = ".\build\Release\unthemidator.exe"
          if (-not (Test-Path $exe)) { throw "Missing built executable" }
          $helpText = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Help smoke test failed" }
          if (-not $helpText.Contains("--runtime-probe-dir") -or -not $helpText.Contains("--runtime-budget")) {
            throw "V18 command-line flags missing"
          }

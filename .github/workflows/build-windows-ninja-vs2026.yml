name: Visual Studio 2026 installed CMake (PowerShell 5.1)

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "scripts/build-v14-vs2026.ps1"
      - ".github/workflows/build-windows-ninja-vs2026.yml"
  workflow_dispatch:

jobs:
  windows-msvc-ninja:
    name: "Windows PowerShell 5.1 / CMake ${{ matrix.cmake }}"
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        cmake: ["3.31.6", "4.5.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test CMake on PATH (do not download from the build script)
        run: python -m pip install "cmake==${{ matrix.cmake }}"

      - name: Compile using installed CMake under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          $cmakeExe = Join-Path $cmakeBin "cmake.exe"
          & $cmakeExe --version
          # Put the already installed CMake on PATH; the build script must discover it.
          $env:Path = "$cmakeBin;$env:Path"
          # Regression: absent optional Chocolatey environment must not crash Test-Path.
          Remove-Item Env:ChocolateyInstall -ErrorAction SilentlyContinue
          $vswhere = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) { throw "Visual Studio 2026 with MSBuild not found" }
          # Reproduce the user environment: powershell.exe 5.1, not pwsh 7.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-v14-vs2026.ps1 -Source $PWD.Path -VS $vsPath
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 build failed ($LASTEXITCODE)" }
          if (-not (Test-Path .\build\Release\unthemidator.exe)) { throw "Ninja output missing in build\Release" }

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $helpText = (& .\build\Release\unthemidator.exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "CLI help smoke test failed" }
          if (-not $helpText.Contains("--runtime-probe-dir")) { throw "Missing runtime probe CLI" }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vs2026-ninja-cmake331-build-log
          path: build-vs2026-ninja/muflex_v14_ninja.log
          if-no-files-found: ignore
